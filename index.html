<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jumers House – ຮ້ານແຟຊັນອອນລາຍ</title>
<meta name="theme-color" content="#1b3555">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 160 160%22%3E%3Crect width=%22160%22 height=%22160%22 rx=%2230%22 fill=%22%231b3555%22/%3E%3Ctext x=%2280%22 y=%2295%22 text-anchor=%22middle%22 font-size=%2250%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22%3EJH%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Noto+Sans+Lao:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ebeae6;--ink:#1b3555;--card:#f7f6f2;--sale:#f2d45c;--mute:#5d6f86;--line:#d3d1ca;--ok:#2f8f5b}
@media(prefers-color-scheme:dark){:root{--bg:#10192a;--ink:#ebeae6;--card:#182742;--mute:#9db0c8;--line:#2a3b58;--sale:#f2d45c}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:'Noto Sans Lao',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px;padding-top:env(safe-area-inset-top,0px)}
h1,h2,.logo b{font-family:'Bricolage Grotesque','Noto Sans Lao',sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font:inherit;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
:focus-visible{outline:3px solid var(--sale);outline-offset:2px}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.logo img{height:46px;width:auto;display:block}
.logo img,.hl,.fl{transition:filter .2s}
@media(prefers-color-scheme:dark){.logo img,.hl,.fl,.splash img{filter:brightness(0) invert(.92)}}
nav{margin-left:auto;display:flex;gap:6px}
nav a,nav button{padding:8px 12px;border-radius:99px;font-weight:600;font-size:14px;text-decoration:none;color:inherit}
nav a:hover,nav button:hover{background:var(--ink);color:var(--bg)}
#cartCount{background:var(--sale);color:#1b3555;border-radius:99px;padding:1px 8px;margin-left:4px;font-weight:800}
.bump{animation:bump .4s}@keyframes bump{50%{transform:scale(1.5)}}
.status{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;font-size:14px;padding:9px 0}
.status span{display:inline-block;padding-left:100%;animation:tick 22s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.hero{display:grid;gap:20px;padding:32px 0 20px;align-items:center}
@media(min-width:760px){.hero{grid-template-columns:1.2fr 1fr}}
.hero h1{font-size:clamp(40px,9vw,84px);line-height:.95;letter-spacing:-.03em}
.hero p{margin:14px 0 20px;color:var(--mute);max-width:42ch}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:99px;font-weight:700;text-decoration:none;transition:transform .2s}
.btn:hover{transform:translateY(-3px) rotate(-1deg)}
.btn.alt{background:var(--sale);color:#1b3555}
.house{position:relative;max-width:340px;margin:auto;width:100%}
.house svg{width:100%;overflow:visible}
@keyframes spin{to{transform:rotate(360deg)}}
.star{display:inline-block;animation:spin 10s linear infinite;color:var(--ink)}
.sale-band .star{color:#1b3555}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .5s,visibility .5s}
.splash.off{opacity:0;visibility:hidden}
.splash img{width:140px;animation:pop .8s ease both}
@keyframes pop{from{transform:scale(.7) rotate(-6deg);opacity:0}}
.splash p{position:absolute;bottom:18%;color:var(--mute);font-size:14px}
.house .tag{position:absolute;background:var(--sale);color:#1b3555;font-weight:800;padding:6px 12px;border-radius:99px;font-size:13px;box-shadow:0 6px 0 rgba(27,53,85,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 14px;scrollbar-width:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;border:1.5px solid var(--ink);font-weight:600;font-size:14px;transition:.2s}
.chip.on,.chip:hover{background:var(--ink);color:var(--bg)}
.search{display:flex;gap:8px;margin:8px 0;position:relative}
.sug{position:absolute;top:100%;left:0;right:0;z-index:15;background:var(--card);border-radius:16px;margin-top:6px;box-shadow:0 14px 34px rgba(0,0,0,.2);max-height:55vh;overflow:auto;display:none}
.sug button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.sug .th{width:44px;height:44px;border-radius:12px;background-size:contain;background-repeat:no-repeat;background-position:center;display:grid;place-items:center;flex:none;background-color:var(--bg)}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--mute);background-size:cover;background-position:center;flex:none}
.dots{display:flex;gap:4px}
.gal{position:relative;border-radius:16px;overflow:hidden;background:#fff}
.gtrack{display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gtrack::-webkit-scrollbar{display:none}
.gtrack img{flex:none;width:100%;max-height:72vh;object-fit:contain;scroll-snap-align:center;display:block}
.cnt{position:absolute;right:10px;bottom:10px;background:rgba(10,20,36,.72);color:#fff;font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px}
.gbtn{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:rgba(10,20,36,.55);color:#fff;font-size:22px;line-height:1}
.gbtn.l{left:8px}.gbtn.r{right:8px}
.qty2{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:99px;padding:4px;flex:none}
.qty2 button{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:18px}
.qty2 b{min-width:22px;text-align:center}
.opt .dot{width:26px;height:26px}
h2{font-size:28px;margin:28px 0 12px;letter-spacing:-.02em}
.sale-band{background:var(--sale);color:#1b3555;border-radius:24px;padding:4px 16px 18px;margin:24px 0}
.sale-band h2{margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.card{background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s;color:var(--ink)}
.card:hover{transform:translateY(-6px) rotate(.4deg);box-shadow:0 14px 0 -6px rgba(27,53,85,.18)}
.ph{aspect-ratio:4/5;position:relative;display:grid;place-items:center;font-size:54px;cursor:pointer;background-size:contain;background-position:center;background-repeat:no-repeat;background-color:#fff}
.badge{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px}
.badge.s{background:var(--sale);color:#1b3555}
.info{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.info b{font-size:15px}
.price{font-weight:800}.old{text-decoration:line-through;color:var(--mute);font-weight:400;font-size:13px;margin-left:6px}
.kip{font-size:12px;color:var(--mute)}
.add{margin-top:auto;background:var(--ink);color:var(--bg);padding:10px;border-radius:12px;font-weight:700;font-size:14px}
.add:active{transform:scale(.95)}
.rate{display:grid;gap:10px;background:var(--card);padding:18px;border-radius:20px;margin:28px 0}
.rate .row{display:flex;gap:8px;align-items:center}
footer{border-top:1px solid var(--line);padding:28px 0;margin-top:36px;color:var(--mute);font-size:14px}
footer a{color:var(--ink);font-weight:600;margin-right:14px}
.dock{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;background:var(--ink);color:var(--bg);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.dock a,.dock button{display:flex;flex-direction:column;align-items:center;font-size:12px;text-decoration:none;color:inherit;gap:2px;padding:2px 12px}
.dock i{font-style:normal;font-size:20px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,20,36,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .3s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.panel h3{font-size:22px;margin-bottom:12px;display:flex;justify-content:space-between}
